<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <link rel="stylesheet"  href="styles.css"/>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    
    <div class="calculator-container">
          <div class="calculator">
            <input id="number-input" disabled type="text">
            <input type="text" placeholder="Answer" disabled id="result">
            <div class="row">
                
                 <div onclick="handleClickButton(this)" class="col cal-buttons">+</div>
                  <div onclick="handleClickButton(this)" class="col cal-buttons">-</div>
                   <div onclick="handleClickButton(this)" class="col cal-buttons">*</div>
                    <div onclick="handleClickButton(this)" class="col cal-buttons">/</div>
            </div>
            <div  class="row">
                   <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">7</div>
                  <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">8</div>
                   <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">9</div>

            </div>
             <div  class="row" >
                   <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">4</div>
                  <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">5</div>
                   <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">6</div>

            </div>
             <div  class="row" >
                   <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">1</div>
                  <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">2</div>
                   <div onclick="handleClickButton(this)" class="col col-3 cal-buttons">3</div>

            </div>
            <div  class="row">
                <div onclick="handleClickButton(this)" class="col col-4 cal-buttons">0</div>
                  <div onclick="reset()" class="col col-8 cal-buttons">Clear</div>

            </div>
          </div>


    </div>
    <script src="script.js"></script>
    <script type="importmap">
{
  "imports": {
    "@floating-ui/dom": "https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.7.6/dist/floating-ui.dom.esm.min.js",
    "vanilla-calendar-pro": "https://cdn.jsdelivr.net/npm/vanilla-calendar-pro@3.4.0/index.mjs"
  }
}
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.min.js" integrity="sha384-BJf/nQgxZJU68GxBse97Vdlc8Rh+z9PzzXiS3/BjV+1nQPR7IKn+iJnD3DJvCMaU" crossorigin="anonymous"></script>
    
</body>
</html>
